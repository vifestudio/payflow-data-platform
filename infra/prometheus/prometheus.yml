global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: ml-service
    metrics_path: /metrics
    static_configs:
      - targets: ["ml-service:8010"]

  - job_name: streaming-consumer
    metrics_path: /metrics
    static_configs:
      - targets: ["streaming-consumer:9108"]
