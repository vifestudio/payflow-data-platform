name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  dbt-parse:
    name: Validate SQL & YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dbt
        run: pip install dbt-duckdb==1.11.0

      - name: dbt parse (no credentials needed)
        working-directory: transform/payflow
        run: dbt parse --profiles-dir .
        env:
          R2_ENDPOINT: "https://placeholder.r2.cloudflarestorage.com"
          R2_ACCESS_KEY_ID: "placeholder"
          R2_SECRET_ACCESS_KEY: "placeholder"

  python-tests:
    name: Python tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [ml, services]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements-${{ matrix.suite }}.txt

      - name: Install dependencies
        run: pip install -r tests/requirements-${{ matrix.suite }}.txt

      - name: pytest
        run: pytest tests/${{ matrix.suite }}

  dbt-test:
    name: Run dbt tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: dbt-parse
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dbt
        run: pip install dbt-duckdb==1.11.0

      - name: dbt seed
        working-directory: transform/payflow
        run: dbt seed --profiles-dir .
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: dbt run
        working-directory: transform/payflow
        run: dbt run --profiles-dir .
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: dbt test
        working-directory: transform/payflow
        run: dbt test --profiles-dir .
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
