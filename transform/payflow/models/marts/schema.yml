version: 2

models:
  - name: dim_merchants
    description: "Merchant dimension: one row per canonical merchant with MCC code, category, and risk tier."
    columns:
      - name: merchant_clean
        tests: [not_null, unique]
      - name: mcc_code
        tests: [not_null]
      - name: mcc_category
        tests: [not_null]
      - name: risk_tier
        tests: [not_null]

  - name: dim_date
    description: "Date dimension: one row per calendar day with year, month, quarter, day_of_week, and is_weekend."
    columns:
      - name: transaction_date
        tests: [not_null, unique]
      - name: year
        tests: [not_null]
      - name: month
        tests: [not_null]
      - name: day_of_week
        tests: [not_null]
      - name: is_weekend
        tests: [not_null]

  - name: fct_transactions
    description: >
      Fact table: one row per transaction with foreign keys to dim_merchants,
      dim_date, and dim_accounts. Measures are amount_usd, latency_ms,
      credit_limit. Built from gold_fraud_features (the validated Gold layer).
    columns:
      - name: transaction_id
        tests: [not_null, unique]
      - name: account_id
        tests: [not_null]
      - name: merchant_clean
        tests: [not_null]
      - name: transaction_date
        tests: [not_null]
      - name: amount_usd
        tests: [not_null]
      - name: is_fraud
        tests: [not_null]

  - name: mart_fraud_by_merchant
    description: "Fraud rate and amounts by canonical merchant, enriched with mcc_category and risk_tier from dim_merchants."
    columns:
      - name: merchant
        tests: [not_null, unique]
      - name: mcc_category
        tests: [not_null]
      - name: risk_tier
        tests: [not_null]
      - name: total_transactions
        tests: [not_null]
      - name: fraud_rate
        tests: [not_null]

  - name: mart_fraud_daily
    description: "Daily fraud trend joined to dim_date for year/month/quarter/is_weekend context."
    columns:
      - name: transaction_date
        tests: [not_null, unique]
      - name: total_transactions
        tests: [not_null]
      - name: fraud_rate
        tests: [not_null]
