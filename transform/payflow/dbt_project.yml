name: 'payflow'
version: '1.0.0'
config-version: 2

profile: 'payflow'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

on-run-start:
  - "INSTALL httpfs; LOAD httpfs;"
  - "{{ setup_r2_secret() }}"

seeds:
  payflow:
    merchant_mcc:
      +column_types:
        mcc_code: varchar(4)
        canonical_merchant: varchar(50)
        mcc_description: varchar(100)
        mcc_category: varchar(50)
        risk_tier: varchar(20)

models:
  payflow:
    staging:
      +materialized: view
    silver:
      +materialized: table
    gold:
      +materialized: table
    marts:
      +materialized: table
