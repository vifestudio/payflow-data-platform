name: 'payflow'
version: '1.0.0'
config-version: 2

profile: 'payflow'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

on-run-start:
  - "INSTALL httpfs; LOAD httpfs;"
  - "{{ setup_r2_secret() }}"

models:
  payflow:
    staging:
      +materialized: view
    silver:
      +materialized: table
    gold:
      +materialized: table
